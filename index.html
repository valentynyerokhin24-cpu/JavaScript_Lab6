<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Lights Out Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>5x5 LightsOut</h1>
        
        <div class="scoreboard">
            <div>Мінімум (Target): <span id="target-count">0</span></div>
            <div>Зроблено ходів: <span id="moves-count">0</span></div>
            <div>Час гри: <span id="timer-count">0:00</span></div>
        </div>

        <div id="game-board" class="board"></div>

        <div class="controls">
            <button id="btn-new-game">New Game</button>
            <button id="btn-restart">Restart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
